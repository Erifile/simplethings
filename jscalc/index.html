<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
</head>
<body>
    <div class="inputs">
        <input type="text" placeholder="Число 1.." id="num1">
        <input type="text" placeholder="Число 2.." id="num2">        
    </div>

    <div class="buttons">
        <button id="plus" class="operation">+</button>
        <button id="minus" class="operation">-</button>
        <button id="multiply" class="operation">*</button>
        <button id="divide" class="operation">/</button>
        <button id="power" class="operation">**</button>
    </div>


    <p id="result">Результат:</p>
</body>
</html>
